name: Build Exaroton IPA

on:
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Select Xcode ──────────────────────────────────────────────────────────
      # Xcode 26 on macos-15 runner (adjust path if Apple changes it in the runner)
      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(find /Applications -name "Xcode*.app" -maxdepth 1 | sort -r | head -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      # ─── Install XcodeGen ──────────────────────────────────────────────────────
      - name: Install XcodeGen
        run: brew install xcodegen

      # ─── Generate Xcode Project from project.yml ───────────────────────────────
      - name: Generate Xcode Project
        run: xcodegen generate

      # ─── Build Archive (no code signing) ──────────────────────────────────────
      - name: Build Archive
        run: |
          mkdir -p build
          xcodebuild archive \
            -project ExarotonApp.xcodeproj \
            -scheme ExarotonApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/build/ExarotonApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            | xcpretty || true
          echo "--- Archive contents ---"
          find "$GITHUB_WORKSPACE/build/ExarotonApp.xcarchive" -name "*.app" 2>/dev/null || echo "Archive not found at expected path"
          ls -la "$GITHUB_WORKSPACE/build/" 2>/dev/null || true

      # ─── Package as .ipa ───────────────────────────────────────────────────────
      - name: Package IPA
        run: |
          ARCHIVE="$GITHUB_WORKSPACE/build/ExarotonApp.xcarchive"
          echo "Looking in: $ARCHIVE"
          ls -la "$GITHUB_WORKSPACE/build/" || true
          # Try archive Products path first, then search whole archive
          APP_PATH=$(find "$ARCHIVE/Products" -name "*.app" -maxdepth 3 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$ARCHIVE" -name "*.app" 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find .app in archive. Contents:"
            find "$GITHUB_WORKSPACE/build" -type f | head -50
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ExarotonApp.ipa Payload/
          echo "IPA size: $(du -sh ExarotonApp.ipa | cut -f1)"

      # ─── Generate SideStore JSON ───────────────────────────────────────────────
      - name: Generate SideStore JSON
        run: |
          # Get file size cross-platform (macOS/Linux)
          IPA_SIZE=$(stat -f%z ExarotonApp.ipa || stat -c%s ExarotonApp.ipa)
          CURRENT_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/latest/ExarotonApp.ipa"
          
          cat <<EOF > sidestore.json
          {
            "name": "Exaroton Development",
            "identifier": "com.exaroton.repo.dev",
            "apps": [
              {
                "name": "ExarotonApp",
                "bundleIdentifier": "com.exaroton.app",
                "developerName": "Exaroton",
                "version": "1.0.0-${{ github.run_number }}",
                "versionDate": "$CURRENT_DATE",
                "versionDescription": "Automated Development Build - ${{ github.sha }}",
                "downloadURL": "$REPO_URL",
                "size": $IPA_SIZE
              }
            ]
          }
          EOF
          cat sidestore.json

      # ─── Upload IPA Artifact ───────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ExarotonApp-IPA
          path: |
            ExarotonApp.ipa
            sidestore.json
          retention-days: 30

      # ─── Update Rolling Release (Development) ──────────────────────────────────
      - name: Update Rolling Release
        if: github.ref == 'refs/heads/development'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ExarotonApp.ipa
            sidestore.json
          name: "Latest Development Build"
          tag_name: "latest"
          body: |
            ## Automated Rolling Release
            This release is automatically updated on every push to \`development\`.

            ### SideStore Installation
            Add this source URL to SideStore for OTA updates:
            \`https://github.com/${{ github.repository }}/releases/download/latest/sidestore.json\`
          prerelease: true

      # ─── Create GitHub Release (on tags) ──────────────────────────────────────
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ExarotonApp.ipa
          name: "Exaroton iOS ${{ github.ref_name }}"
          body: |
            ## Install Instructions
            1. Download `ExarotonApp.ipa`
            2. Open **AltStore** on your Mac/PC
            3. Drag the `.ipa` onto AltStore (or use File > Sideload)
            4. AltStore will sign it with your free Apple ID and install it
            5. Trust the developer certificate in iOS Settings → VPN & Device Management
            
            > The app must be **refreshed in AltStore every 7 days** (free Apple ID limit)
