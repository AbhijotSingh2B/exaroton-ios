name: ExarotonApp
options:
  bundleIdPrefix: com.exaroton
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

targets:
  ExarotonApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: Sources/ExarotonApp
        excludes:
          - Resources/**
    resources:
      - path: Sources/ExarotonApp/Resources
    info:
      path: Sources/ExarotonApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Exaroton
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "3"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUserNotificationsUsageDescription: "Get notified when your Minecraft server starts or stops."
        NSUserNotificationUsageDescription: "Get notified when your Minecraft server starts or stops."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.exaroton.ios
        SWIFT_VERSION: "5.10"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: "YES"
        ALWAYS_SEARCH_USER_PATHS: "NO"
        CLANG_ENABLE_OBJC_WEAK: "YES"
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
